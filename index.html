<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wikitext Editor</title>
  <meta name="description" content="Edit MediaWiki .wiki files in the browser with a live article preview.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2336c'/><text x='16' y='23' font-size='18' font-family='Georgia' text-anchor='middle' fill='white'>W</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">W</span> Wikitext Editor</div>
    <div class="file-info">
      <input id="filename" class="filename" value="untitled.wiki" spellcheck="false" aria-label="File name">
      <span id="status" class="status"></span>
    </div>
    <div class="actions">
      <button id="btn-open" class="btn" title="Open a .wiki file">Open</button>
      <button id="btn-new" class="btn" title="Start a new document">New</button>
      <button id="btn-sample" class="btn" title="Load an example article">Sample</button>
      <button id="btn-help" class="btn" title="Wikitext syntax reference (F1)">? Help</button>
      <button id="btn-export" class="btn primary" title="Download the .wiki file (Ctrl+S)">Export .wiki</button>
      <input id="file-input" type="file" accept=".wiki,.wikitext,.mediawiki,.txt,text/plain" hidden>
    </div>
  </header>

  <main class="panes">
    <section class="pane editor-pane" id="editor-pane">
      <div class="toolbar" role="toolbar" aria-label="Formatting">
        <select id="tb-heading" title="Insert heading">
          <option value="">Heading…</option>
          <option value="2">Heading 2</option>
          <option value="3">Heading 3</option>
          <option value="4">Heading 4</option>
          <option value="5">Heading 5</option>
        </select>
        <span class="sep"></span>
        <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button data-cmd="link" title="Internal link (Ctrl+K)">[[ ]]</button>
        <button data-cmd="extlink" title="External link">🔗</button>
        <span class="sep"></span>
        <button data-cmd="ul" title="Bulleted list">• List</button>
        <button data-cmd="ol" title="Numbered list">1. List</button>
        <button data-cmd="indent" title="Indent / definition">⇥</button>
        <span class="sep"></span>
        <button data-cmd="image" title="Image placeholder">🖼 Image</button>
        <button data-cmd="table" title="Insert table">▦ Table</button>
        <button data-cmd="ref" title="Reference / footnote">Ref</button>
        <button data-cmd="template" title="Template">{{ }}</button>
        <button data-cmd="hr" title="Horizontal rule">―</button>
        <button data-cmd="nowiki" title="Escape markup">nowiki</button>
        <div class="zoom" data-zoom-target="editor" role="group" aria-label="Editor text size">
          <button data-zoom="-1" title="Smaller editor text">A−</button>
          <button data-zoom="0" class="zoom-val" title="Reset editor text size">100%</button>
          <button data-zoom="1" title="Larger editor text">A+</button>
        </div>
      </div>
      <div class="editor-wrap">
        <textarea id="editor" spellcheck="true" placeholder="Type wikitext here, or drop a .wiki file…"></textarea>
        <div id="dropzone" class="dropzone">
          <div class="dz-inner">
            <div class="dz-icon">⇪</div>
            <p><strong>Drop a .wiki file here</strong></p>
            <p>or <button id="dz-browse" class="linklike">browse your files</button></p>
            <p class="dz-hint">or just <button id="dz-type" class="linklike">start typing</button> · <button id="dz-sample" class="linklike">load a sample</button></p>
          </div>
        </div>
      </div>
      <div class="editor-foot"><span id="counts">0 words</span><span>Autosaved in this browser</span></div>
    </section>

    <div class="divider" id="divider" title="Drag to resize"></div>

    <section class="pane preview-pane">
      <div class="preview-head">
        <span>Preview</span>
        <div class="zoom" data-zoom-target="preview" role="group" aria-label="Preview text size">
          <button data-zoom="-1" title="Smaller preview text">A−</button>
          <button data-zoom="0" class="zoom-val" title="Reset preview text size">100%</button>
          <button data-zoom="1" title="Larger preview text">A+</button>
        </div>
      </div>
      <div class="preview-scroll" id="preview-scroll">
        <article class="wiki">
          <h1 class="wiki-title" id="wiki-title">Untitled</h1>
          <div id="preview" class="wiki-body"></div>
        </article>
      </div>
    </section>
  </main>

  <div class="global-drop" id="global-drop"><div>Drop to open</div></div>

  <dialog id="help" class="help">
    <div class="help-head">
      <h2>Wikitext quick reference</h2>
      <input id="help-search" type="search" placeholder="Filter… (e.g. table, link)" aria-label="Filter syntax">
      <button class="close" id="help-close" aria-label="Close">×</button>
    </div>
    <div class="help-body" id="help-body"></div>
    <div class="help-foot">Click an example to insert it at the cursor. Shortcuts: Ctrl+B bold · Ctrl+I italic · Ctrl+K link · Ctrl+S export · F1 help</div>
  </dialog>

  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
